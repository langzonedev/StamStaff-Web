<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#250861" />
    <title>StamStaff is offline</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #f1f4fa;
        color: #13072f;
        font:
          18px/1.5 Inter,
          system-ui,
          sans-serif;
      }
      .card {
        max-width: 520px;
        padding: 32px;
        border: 1px solid #d7d8e5;
        border-radius: 12px;
        background: #f8f9fd;
      }
      h1 {
        margin: 0 0 12px;
        font-size: 2rem;
      }
      p {
        margin: 0 0 14px;
      }
      small {
        color: #635d78;
      }
      button {
        min-height: 48px;
        padding: 0 20px;
        border: 0;
        border-radius: 6px;
        background: #6c19ff;
        color: white;
        font: inherit;
        font-weight: 800;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>You’re offline</h1>
      <p>Connect to the internet before reserving or releasing a shift.</p>
      <small>This prototype does not queue roster changes while offline.</small>
      <p><button onclick="location.reload()">Try again</button></p>
    </main>
  </body>
</html>
